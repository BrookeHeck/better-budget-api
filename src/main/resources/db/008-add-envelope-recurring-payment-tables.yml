databaseChangeLog:
  - changeSet:
      id: 001
      author: brooke.heck
      changes:
        - createTable:
            tableName: envelope
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_envelope_id
              - column:
                  name: allowed_budget
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: last_refill
                  type: date
              - column:
                  name:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_account_id
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
        - createTable:
            tableName: transaction
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transaction_id
                    nullable: false
              - column:
                  name: category
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(75)
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: account_id
                  type: bigint
        - createTable:
            tableName: transaction_item
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transaction_item_id
                    nullable: false
              - column:
                  name: category
                  type: varchar(15)
              - column:
                  name: amount
                  type: double
              - column:
                  name: transaction_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: user_id
            referencedTableName: bb_user
            referencedColumnNames: id
            constraintName: fk_user
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: user_id
            referencedTableName: bb_user
            referencedColumnNames: id
            constraintName: fk_user
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: account_id
            referencedTableName: account
            referencedColumnNames: id
            constraintName: fk_account
        - addForeignKeyConstraint:
            baseTableName: transaction_item
            baseColumnNames: transaction_id
            referencedTableName: transaction
            referencedColumnNames: id
            constraintName: fk_transaction
