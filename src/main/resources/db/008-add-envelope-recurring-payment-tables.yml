databaseChangeLog:
  - changeSet:
      id: 008
      author: brooke.heck
      changes:
        - createTable:
            tableName: budget_category
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  incrementBy: 1
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_budget_category_id
              - column:
                  name: budget
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
        - createTable:
            tableName: recurring_payment
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  incrementBy: 1
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_recurring_payment_id
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: payment_interval
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: next_payment_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: notifications
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
        - modifyDataType:
            tableName: transaction
            columnName: category
            newDataType: int
        - addForeignKeyConstraint:
            baseTableName: budget_category
            baseColumnNames: user_id
            referencedTableName: bb_user
            referencedColumnNames: id
            constraintName: fk_budget_category_user
        - addForeignKeyConstraint:
            baseTableName: recurring_payment
            baseColumnNames: user_id
            referencedTableName: bb_user
            referencedColumnNames: id
            constraintName: fk_recurring_payment_user
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: id
            referencedTableName: budget_category
            referencedColumnNames: id
            constraintName: fk_transaction_budget_category
