databaseChangeLog:
  - changeSet:
      id: 2026-02-17.create_a_user_table
      author: brooke.heck
      changes:
        - createTable:
            tableName: bb_user
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_user_id
              - column:
                  name: email
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_user_email
              - column:
                  name: password
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(10)
  - changeSet:
      id: 2026-02-17.create_a_account_table
      author: brooke.heck
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_account_id
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_account_user_id
                    nullable: false
                    referencedTableName: user
                    referencedColumnNames: id
                    deleteCascade: true
  - changeSet:
      id: 2026-02-17.create_c_transaction_table
      author: brooke.heck
      changes:
        - createTable:
            tableName: transaction
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transaction_id
                    nullable: false
              - column:
                  name: category
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(75)
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_transaction_user_id
                    nullable: false
                    referencedTableName: user
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_transaction_account_id
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: id
                    deleteCascade: true
  - changeSet:
      id: 2026-02-17.create_d_transaction_item_table
      author: brooke.heck
      changes:
        - createTable:
            tableName: transaction_item
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transaction_item_id
                    nullable: false
              - column:
                  name: category
                  type: varchar(15)
              - column:
                  name: amount
                  type: double
              - column:
                  name: transaction_id
                  constraints:
                    foreignKeyName: fk_transaction_item_transaction_id
                    nullable: false
                    referencedTableName: transaction
                    referencedColumnNames: id
                    deleteCascade: true
