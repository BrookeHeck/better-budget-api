spring:
  application:
    name: budget
  datasource:
    url: jdbc:postgresql://localhost:5432/better_budget
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-main.yml