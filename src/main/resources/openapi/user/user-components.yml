components:
  schemas:
    User:
      properties:
        userId:
          type: integer
          format: int64
          example: 12
          description: User identifier
        email:
          type: string
          example: test@gmail.com
          description: Email of user
        password:
          type: string
          example: my_password
          description: Password of user
        firstName:
          type: string
          example: Alex
          description: First name of user
        lastName:
          type: string
          example: Smith
          description: Last name of user
        status:
          type: string
          example: ACTIVE
          description: Status of user
          enum: [ ACTIVE, INACTIVE ]
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: jwt-token-fsdjkjfefjkl533
          description: JWT authorization token
        user:
          $ref: '#/components/schemas/User'
