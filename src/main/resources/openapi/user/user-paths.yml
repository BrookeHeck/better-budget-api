paths:
  /login:
    post:
      operationId: login
      tags:
        - user
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: Basic dXNlcjpwYXNzd29yZA==
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: './user-components.yml#/components/schemas/LoginResponse'
  /register:
    post:
      operationId: register
      tags:
        - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: './user-components.yml#/components/schemas/User'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: './user-components.yml#/components/schemas/User'
