components:
  schemas:
    RecurringPayment:
      description: recurring payment details
      required:
        - name
        - paymentInterval
        - nextPaymentDate
        - userId
        - notifications
      properties:
        recurringPaymentId:
          type: integer
          format: int64
          example: 12
          description: recurring payment identifier
        name:
          type: string
          example: Electric Bill
          description: name of recurring payment
        paymentAmount:
          type: number
          format: double
          example: 100.00
          description: payment amount amount
        paymentInterval:
          type: string
          example: MONTHLY
          description: interval of payment
          nullable: false
          enum:
            - WEEKLY
            - BIMONTHLY
            - MONTHLY
            - QUARTERLY
            - BIANNUALLY
            - ANNUALLY
        nextPaymentDate:
          type: string
          format: date
          example: "2026-03-10"
          nullable: false
        notifications:
          type: boolean
          example: true
          nullable: false
        userId:
          type: integer
          format: int64
          example: 2
          description: user owning budget category
