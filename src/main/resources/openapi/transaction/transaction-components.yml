components:
  schemas:
    Transaction:
      properties:
        transactionId:
          type: integer
          format: int64
          example: 244
          description: Transaction identifier
        category:
          type: string
          example: "Automotive"
          description: Transaction category
        amount:
          type: number
          format: double
          example: 100.00
          description: Transaction amount
        description:
          type: string
          example: "New tires and brakes"
          description: Transaction description
        dateOfTransaction:
          type: string
          format: date
          example: "2020-01-01"
        accountId:
          type: number
          format: int64q
          description: Account id associated with the transaction
          example: 62
        userId:
          type: number
          format: int64
          description: User id associated with the transaction
          example: 5
