components:
  schemas:
    Transaction:
      description: transaction details
      required:
        - transactionType
        - categoryId
        - amount
        - dateOfTransaction
        - accountId
        - userId
      properties:
        transactionId:
          type: integer
          format: int64
          example: 244
          description: Transaction identifier
        transactionType:
          type: string
          example: DEPOSIT
          description: The type of transaction
          nullable: false
          enum:
            - EXPENSE
            - TRANSFER
            - DEPOSIT
            - LOAN_PAYMENT
        categoryId:
          type: integer
          format: int64
          example: 36
          description: budget category that transaction belongs in
        amount:
          type: number
          format: double
          example: 100.00
          description: Transaction amount
          nullable: false
        description:
          type: string
          example: "New tires and brakes"
          description: Transaction description
          nullable: true
        dateOfTransaction:
          type: string
          format: date
          example: "2020-01-01"
          nullable: false
        accountId:
          type: integer
          format: int64q
          description: Account id associated with the transaction
          example: 62
          nullable: false
        userId:
          type: integer
          format: int64
          description: User id associated with the transaction
          example: 5
          nullable: false
    TransactionTransfer:
      type: object
      required:
        - to
        - from
      properties:
        to:
          $ref: '#/components/schemas/Transaction'
        from:
          $ref: '#/components/schemas/Transaction'
