components:
  schemas:
    Transaction:
      properties:
        transactionId:
          type: integer
          format: int64
          example: 244
          description: Transaction identifier
        category:
          type: string
          example: "Automotive"
          description: Transaction category
        amount:
          type: number
          format: double
          example: 100.00
          description: Transaction amount
        description:
          type: string
          example: "New tires and brakes"
          description: Transaction description
        dateOfTransaction:
          type: string
          format: date
          example: "2020-01-01"
        account:
          type: object
          description: Account associated with the transaction
          allOf:
            - $ref: './../account/accounts-components.yml#/components/schemas/Account'
        user:
          type: object
          description: User associated with the transaction
          allOf:
            - $ref: './../user/user-components.yml#/components/schemas/User'
