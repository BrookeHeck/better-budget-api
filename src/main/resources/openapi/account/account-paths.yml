paths:
  /account/{userId}:
    get:
      operationId: getUserAccounts
      tags:
        - account
      description: Get a list of the user's accounts
      parameters:
        - name: userId
          in: path
          required: true
          description: Id of user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './accounts-components.yml#/components/schemas/Account'
  /account/{accountId}:
    get:
      operationId: getAccount
      tags:
        - account
      description: Get account by id
      parameters:
        - name: accountId
          in: path
          required: true
          description: Id of account to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieve account with id
          content:
            application/json:
              schema:
                $ref: './accounts-components.yml#/components/schemas/Account'
    delete:
      operationId: deleteAccount
      tags:
        - account
      description: Delete an existing account
      parameters:
        - name: accountId
          in: path
          required: true
          description: Id of account to delete
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully delete account
  /account:
    post:
      operationId: createAccount
      tags:
        - account
      description: Create an account
      requestBody:
        content:
          application/json:
            schema:
              $ref: './accounts-components.yml#/components/schemas/Account'
      responses:
        '201':
          description: Successfully created new account
          content:
            application/json:
              schema:
                $ref: './accounts-components.yml#/components/schemas/Account'
    put:
      operationId: updateAccount
      tags:
        - account
      description: Update an existing account
      requestBody:
        content:
          application/json:
            schema:
              $ref: './accounts-components.yml#/components/schemas/Account'
      responses:
        '200':
          description: Successfully updated an existing account
          content:
            application/json:
              schema:
                $ref: './accounts-components.yml#/components/schemas/Account'
