components:
  schemas:
    Account:
      type: object
      description: bank, loan, or credit account details
      properties:
        accountId:
          type: integer
          format: int64
          example: 123
          description: account identifier
        name:
          type: string
          description: Name of the account
          example: Savings Account
        balance:
          type: number
          format: double
          example: 100.49
        accountType:
          type: string
          example: SAVING
          description: The type of account
          enum:
            - CHECKING
            - SAVING
            - LOAN
            - CREDIT
        userId:
          type: integer
          format: int64
          example: 30
          description: User id of the account owner
