components:
  schemas:
    Account:
      type: object
      description: bank, loan, or credit account details
      properties:
        id:
          type: integer
          format: int64
          example: 123
          description: Id of the account
        name:
          type: string
          description: Name of the account
          example: Savings Account
        balance:
          type: number
          example: 100.49
        accountType:
          type: string
          example: SAVING
          description: The type of account
          enum:
            - CHECKING
            - SAVING
            - LOAN
            - CREDIT
        userId:
          type: integer
          format: int64
          example: 23
          description: The id of the user the account belongs to
