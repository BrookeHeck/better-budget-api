components:
  schemas:
    TransactionItem:
      properties:
        transactionItemId:
          type: integer
          format: int64
          example: 1
          description: Transaction item identifier
        category:
          type: string
          example: "Pasta"
          description: Category of the transaction item
        amount:
          type: number
          format: double
          example: 10.5
          description: Amount of the transaction item
        transactionId:
          type: number
          format: int64
          description: Transaction id that the transaction item belongs to
          example: 40
