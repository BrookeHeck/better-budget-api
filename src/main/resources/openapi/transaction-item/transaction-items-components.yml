components:
  schemas:
    TransactionItem:
      properties:
        transactionItemId:
          type: integer
          format: int64
          example: 1
          description: Transaction item identifier
        category:
          type: string
          example: "Pasta"
          description: Category of the transaction item
        amount:
          type: number
          format: double
          example: 10.5
          description: Amount of the transaction item
        transaction:
          type: object
          description: Transaction that the transaction item belongs to
          allOf:
            - $ref: "./../transaction/transaction-components.yml#/components/schemas/Transaction"
